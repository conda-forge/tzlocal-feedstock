schema_version: 1

context:
  version: "5.4.3"

package:
  name: tzlocal
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tzlocal/tzlocal-${{ version }}.tar.gz
  sha256: 3a8c9bc18cf47e1dcde252ea0e6a72a6cde320a400b6ac6db1f1f8cccd553c00

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv --no-build-isolation --no-deps

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=64
  run:
    - python >=${{ python_min }}
    - if: win
      then:
        - python-tzdata
        - __win
      else:
        - __unix

tests:
  - python:
      imports:
        - tzlocal
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  license: MIT
  license_file: LICENSE.txt
  summary: tzinfo object for the local timezone
  homepage: https://github.com/regebro/tzlocal
  repository: https://github.com/regebro/tzlocal

extra:
  recipe-maintainers:
    - ericdill
    - licode
    - tacaswell
    - synapticarbors
